name: CI

# Manual only. The two jobs below install Chromium and pull a pinned Playwright
# container, which is the expensive part of the bill, and `npm run check` already
# runs the same gate locally — so paying Actions minutes on every push buys
# nothing today. Re-enable by restoring the two triggers under `on:`:
#
#   push:
#     branches: [main]
#   pull_request:
#
# release.yml calls this workflow as its gate, so a tag is only published once
# both jobs pass on exactly the tagged commit.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The only lockfile in the repo is pnpm-lock.yaml. `npm ci` requires a
      # package-lock.json and fails outright without one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Acceptance 14, belt and braces: Biome sees neither Svelte templates nor .html.
      - name: No shadow DOM anywhere in src/
        run: pnpm run lint:no-shadow

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build all four artefacts
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Real Chromium: jsdom implements none of ElementInternals, CustomStateSet
      # or the CSS Custom Highlight API, all of which are load-bearing here.
      - name: Test
        run: pnpm test

      # `npx skills add naz-ovh/forgedoc` is the advertised install. A typo in a
      # frontmatter block, or a rename of either skills/ directory, breaks it
      # silently — nothing else in this job reads SKILL.md as the CLI does.
      - name: Both skills are discoverable by the skills CLI
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          listed=$(npx --yes skills add ./ --list)
          echo "$listed"
          for skill in better-plan better-docs; do
            echo "$listed" | grep -q "$skill" || {
              echo "::error::$skill is not discoverable by the skills CLI"
              exit 1
            }
          done

      - name: Fail if the working tree is dirty
        # docs/REFERENCE.md is generated; a stale commit shows up here.
        run: git diff --exit-code

  browser:
    name: Delivered-artefact behaviour
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Behaviour only — the offline `file://` document, the CDN-linked one, and
      # the Geist build's embedded fonts. Nothing here asserts on appearance.
      - name: Offline, CDN and themed-build behaviour
        run: pnpm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-context
          path: tests/visual/.output
          retention-days: 7
